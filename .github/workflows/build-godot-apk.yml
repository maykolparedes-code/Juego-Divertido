name: Build 3D adventure APK

on:
  push:
    branches:
      - claude/android-game-ads-monetization-odqhws
    paths:
      - "aventura-3d/**"
      - ".github/workflows/build-godot-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3-stable
  GODOT_VERSION_DIR: 4.3.stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot editor (Linux headless)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot

      - name: Download Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz -d extracted_templates
          mv extracted_templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}/"

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot at the Android SDK and debug keystore on this runner
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project (generates .godot/ cache, resolves class_name scripts)
        working-directory: aventura-3d
        run: godot --headless --editor --quit

      - name: Run gameplay smoke test
        working-directory: aventura-3d
        run: godot --headless res://tests/SmokeTest.tscn

      - name: Export debug APK
        working-directory: aventura-3d
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/aventura-3d.apk --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aventura-3d-debug-apk
          path: aventura-3d/build/aventura-3d.apk
          if-no-files-found: error

      # Los artefactos normales de Actions se sirven desde Azure Blob
      # Storage, que la política de red de algunos entornos bloquea. Un
      # Release de GitHub sirve sus assets desde
      # release-assets.githubusercontent.com, que sí es alcanzable, así que
      # publicamos también ahí para poder descargar el APK directamente.
      - name: Publish APK as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aventura3d-build-${{ github.run_number }}
          name: "Aventura 3D - build de depuración #${{ github.run_number }}"
          body: |
            APK de depuración generado automáticamente desde el commit ${{ github.sha }}.
            No es una versión de Play Store: es solo para probar en tu dispositivo.
          prerelease: true
          files: aventura-3d/build/aventura-3d.apk
